[tool.poetry]
name = "agentic-finance-data-extractor"
version = "0.1.0"
description = "Agentic financial data extraction and credit-risk scoring from Australian annual reports"
readme = "README.md"
authors = ["Dasun <dasun@altrium.io>"]
packages = [{ include = "afde", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
# Orchestration
langgraph = ">=0.2.50"
langgraph-checkpoint-sqlite = ">=2.0.1"
# LLM + embeddings (all local)
sentence-transformers = ">=3.0.0"
requests = ">=2.32.0"
# PDF / parsing
docling = ">=2.8.0"
pypdf = ">=5.1.0"
pymupdf = ">=1.24.0"
pdf2image = ">=1.17.0"
# Validation + data
pydantic = ">=2.9.0"
pyyaml = ">=6.0.2"
python-dotenv = ">=1.0.1"
# CLI + reporting
typer = ">=0.13.0"
rich = ">=13.9.0"
weasyprint = ">=63.0"
jinja2 = ">=3.1.0"
markdown = ">=3.7"
# Utilities
tenacity = ">=9.0.0"
# Optional extras
paddleocr = { version = ">=2.8.1", optional = true }
pytesseract = { version = ">=0.3.13", optional = true }
pillow = { version = ">=10.4.0", optional = true }
numpy = { version = ">=1.26.0", optional = true }

[tool.poetry.extras]
ocr = ["paddleocr", "pillow", "numpy"]
tesseract = ["pytesseract", "pillow"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-cov = ">=6.0.0"
ruff = ">=0.7.0"

[tool.poetry.scripts]
afde = "afde.cli:app"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
