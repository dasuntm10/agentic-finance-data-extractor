# Scoring thresholds and weights — calibrated to public credit-rating bands.
# Editable without touching code; reloaded on every run.

profiles:
  corporate:
    weights:
      profitability: 0.30
      leverage: 0.25
      coverage: 0.25
      liquidity: 0.20
    ratios:
      net_profit_margin:
        category: profitability
        # value -> sub_score band (piecewise linear)
        bands:
          - {value: 0.20, score: 100, band: "AA"}
          - {value: 0.10, score: 75,  band: "A"}
          - {value: 0.05, score: 50,  band: "BBB"}
          - {value: 0.00, score: 25,  band: "BB"}
          - {value: -0.05, score: 0,  band: "D"}
      ebit_margin:
        category: profitability
        bands:
          - {value: 0.20, score: 100, band: "AA"}
          - {value: 0.10, score: 75,  band: "A"}
          - {value: 0.05, score: 50,  band: "BBB"}
          - {value: 0.00, score: 25,  band: "BB"}
          - {value: -0.05, score: 0,  band: "D"}
      current_ratio:
        category: liquidity
        bands:
          - {value: 2.0, score: 100, band: "AA"}
          - {value: 1.5, score: 75,  band: "A"}
          - {value: 1.2, score: 50,  band: "BBB"}
          - {value: 1.0, score: 25,  band: "BB"}
          - {value: 0.8, score: 0,   band: "D"}
      quick_ratio:
        category: liquidity
        bands:
          - {value: 1.5, score: 100, band: "AA"}
          - {value: 1.0, score: 75,  band: "A"}
          - {value: 0.8, score: 50,  band: "BBB"}
          - {value: 0.5, score: 25,  band: "BB"}
          - {value: 0.3, score: 0,   band: "D"}
      debt_to_equity:
        category: leverage
        # lower is better — bands listed high score → low score by *low* value
        invert: true
        bands:
          - {value: 0.3, score: 100, band: "AA"}
          - {value: 0.6, score: 75,  band: "A"}
          - {value: 1.0, score: 50,  band: "BBB"}
          - {value: 1.5, score: 25,  band: "BB"}
          - {value: 2.5, score: 0,   band: "D"}
      interest_coverage:
        category: coverage
        bands:
          - {value: 12.0, score: 100, band: "AA"}
          - {value: 6.0,  score: 75,  band: "A"}
          - {value: 3.0,  score: 50,  band: "BBB"}
          - {value: 1.5,  score: 25,  band: "BB"}
          - {value: 1.0,  score: 0,   band: "D"}

  financial:
    weights:
      profitability: 0.30
      capital: 0.30
      asset_quality: 0.25
      liquidity: 0.15
    ratios:
      net_profit_margin:
        category: profitability
        bands:
          - {value: 0.20, score: 100, band: "AA"}
          - {value: 0.10, score: 75,  band: "A"}
          - {value: 0.00, score: 50,  band: "BBB"}
          - {value: -0.05, score: 25, band: "BB"}
          - {value: -0.15, score: 0,  band: "D"}
      cost_to_income:
        category: profitability
        invert: true   # lower is better
        bands:
          - {value: 0.50, score: 100, band: "AA"}
          - {value: 0.65, score: 75,  band: "A"}
          - {value: 0.80, score: 50,  band: "BBB"}
          - {value: 0.95, score: 25,  band: "BB"}
          - {value: 1.10, score: 0,   band: "D"}
      equity_to_assets:
        category: capital
        bands:
          - {value: 0.15, score: 100, band: "AA"}
          - {value: 0.08, score: 75,  band: "A"}
          - {value: 0.05, score: 50,  band: "BBB"}
          - {value: 0.03, score: 25,  band: "BB"}
          - {value: 0.01, score: 0,   band: "D"}
      return_on_equity:
        category: asset_quality
        bands:
          - {value: 0.15, score: 100, band: "AA"}
          - {value: 0.08, score: 75,  band: "A"}
          - {value: 0.03, score: 50,  band: "BBB"}
          - {value: 0.00, score: 25,  band: "BB"}
          - {value: -0.10, score: 0,  band: "D"}

# Composite -> band mapping
composite_bands:
  - {min: 85, band: "AA"}
  - {min: 70, band: "A"}
  - {min: 55, band: "BBB"}
  - {min: 40, band: "BB"}
  - {min: 25, band: "B"}
  - {min: 0,  band: "D"}

anomaly_keywords:
  - going concern
  - material uncertainty
  - qualified opinion
  - emphasis of matter
  - restated
  - significant doubt
  - covenant breach
  - contingent liability

yoy_deterioration_sub_score_drop: 25
